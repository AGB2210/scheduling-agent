name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    # The tests use fake models, so they need no GPU and no Ollama.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

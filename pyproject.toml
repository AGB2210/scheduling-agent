[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "schedagent"
version = "0.1.0"
description = "A local agent that books meetings from plain-language requests."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9", "ollama>=0.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
schedagent = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
